name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20.19.0, 22.13.0, 24.x, 26.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run test:resources
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.x'

  minimum-runtime:
    name: Minimum runtime / Node 20.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20.0.0
          package-manager-cache: false
      # Runtime tests use only Node/npm; modern lint tools have a higher minimum.
      - run: npm test

  gate:
    name: Quality gate
    if: always()
    needs: [quality, minimum-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every quality job to succeed
        env:
          MATRIX_RESULT: ${{ needs.quality.result }}
          MINIMUM_RESULT: ${{ needs.minimum-runtime.result }}
        run: |
          test "$MATRIX_RESULT" = success
          test "$MINIMUM_RESULT" = success
